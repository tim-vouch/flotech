# Publishes site/ to GitHub Pages (flotechheating.co.uk) on every push to main.
name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Pushes made by the daily reviews job don't trigger other workflows, so publish after it runs too.
  workflow_run:
    workflows: ["Update reviews"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
